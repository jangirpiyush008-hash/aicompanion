<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" role="img" aria-label="Secret Desires">
  <!-- "secret" — charcoal wordmark -->
  <text
    x="0" y="60"
    font-family="Manrope, Inter, system-ui, sans-serif"
    font-weight="900" font-size="46"
    fill="#1e1a1c"
    letter-spacing="-1.5"
  >secret</text>

  <!-- Magenta chat-bubble with the tail at bottom-left, containing "desires" + heart -->
  <path
    d="M155 10
       H326
       Q338 10 338 22
       V62
       Q338 74 326 74
       H196
       L178 88
       L184 74
       H167
       Q155 74 155 62
       V22
       Q155 10 167 10 Z"
    fill="#e63985"
  />

  <!-- "desires" inside the bubble -->
  <text
    x="170" y="58"
    font-family="Manrope, Inter, system-ui, sans-serif"
    font-weight="900" font-size="40"
    fill="#ffffff"
    letter-spacing="-1"
  >desires</text>

  <!-- Heart, right-aligned inside the bubble -->
  <path
    d="M302 30
       C302 25 306 21 310 21
       C313 21 315.5 22.5 317 25
       C318.5 22.5 321 21 324 21
       C328 21 332 25 332 30
       C332 36 324 41 317 47
       C310 41 302 36 302 30 Z"
