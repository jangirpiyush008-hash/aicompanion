<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AI Companions Labs">
  <defs>
    <linearGradient id="acl-plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1424"/>
      <stop offset="1" stop-color="#1a0810"/>
    </linearGradient>
  </defs>
  <!-- Dark plum plate — deliberately not the SDAI/heart pink -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#acl-plate)"/>
  <!-- Serif italic "A" monogram, cream — reads as an editorial publication -->
  <text
    x="32" y="47"
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
    font-size="44"
    font-weight="700"
    font-style="italic"
    text-anchor="middle"
    fill="#f6ead6"
    letter-spacing="-1"
  >A</text>
  <!-- Thin pink underline — subtle brand tie to the site's rose palette -->
  <rect x="22" y="52" width="20" height="2" rx="1" fill="#f0417e"/>
</svg>
